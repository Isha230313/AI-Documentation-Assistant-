[project]
name = "ai-documentation-assistant"
version = "0.1.0"
description = "Domain-specific RAG-based AI Documentation Assistant"
requires-python = ">=3.10"
dependencies = [
    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-qdrant>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    # Vector database
    "qdrant-client>=1.12.0",
    # Document parsers
    "pypdf>=5.0.0",
    "docx2txt>=0.8",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "requests>=2.32.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "streamlit>=1.58.0",
]

[project.optional-dependencies]
dev = ["jupyter>=1.1.0", "ipywidgets>=8.0.0"]
